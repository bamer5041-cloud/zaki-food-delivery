<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App - Manage Your Tasks</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #667eea;
            --secondary: #764ba2;
            --success: #48bb78;
            --warning: #f6ad55;
            --danger: #f56565;
            --light: #f7fafc;
            --dark: #2d3748;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        header {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
            text-align: center;
        }

        header h1 {
            color: var(--dark);
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        header p {
            color: #718096;
            font-size: 1.05em;
        }

        .content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        @media (max-width: 768px) {
            .content {
                grid-template-columns: 1fr;
            }
        }

        .panel {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        .panel h2 {
            color: var(--dark);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            color: var(--dark);
            font-weight: 600;
            margin-bottom: 8px;
        }

        input[type="text"],
        input[type="date"],
        textarea,
        select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 1em;
            font-family: inherit;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus,
        input[type="date"]:focus,
        textarea:focus,
        select:focus {
            outline: none;
            border-color: var(--primary);
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        @media (max-width: 768px) {
            .form-row {
                grid-template-columns: 1fr;
            }
        }

        button {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1em;
            font-weight: 600;
            transition: all 0.3s;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            color: white;
            width: 100%;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .btn-small {
            padding: 8px 16px;
            font-size: 0.9em;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-success {
            background: var(--success);
            color: white;
        }

        .btn-danger {
            background: var(--danger);
            color: white;
        }

        .btn-warning {
            background: var(--warning);
            color: white;
        }

        .btn-small:hover {
            opacity: 0.8;
        }

        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 20px;
        }

        .stat-card {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }

        .stat-value {
            font-size: 2em;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 0.9em;
            opacity: 0.9;
        }

        .todo-list {
            max-height: 500px;
            overflow-y: auto;
        }

        .todo-item {
            background: var(--light);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            display: flex;
            gap: 12px;
            align-items: flex-start;
            border-left: 4px solid var(--primary);
            transition: all 0.3s;
        }

        .todo-item.completed {
            opacity: 0.6;
            background: #f0f4f8;
        }

        .todo-item.high-priority {
            border-left-color: var(--danger);
            background: rgba(245, 101, 101, 0.05);
        }

        .todo-item.medium-priority {
            border-left-color: var(--warning);
        }

        .todo-item.low-priority {
            border-left-color: var(--success);
        }

        .todo-item:hover {
            transform: translateX(5px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .todo-checkbox {
            width: 20px;
            height: 20px;
            cursor: pointer;
            margin-top: 3px;
            flex-shrink: 0;
        }

        .todo-content {
            flex-grow: 1;
        }

        .todo-title {
            font-weight: 600;
            color: var(--dark);
            margin-bottom: 5px;
            word-break: break-word;
        }

        .todo-item.completed .todo-title {
            text-decoration: line-through;
            color: #a0aec0;
        }

        .todo-description {
            color: #718096;
            font-size: 0.9em;
            margin-bottom: 8px;
        }

        .todo-meta {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            font-size: 0.85em;
        }

        .badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 20px;
            font-weight: 500;
        }

        .badge-category {
            background: #e2e8f0;
            color: var(--dark);
        }

        .badge-priority {
            color: white;
        }

        .badge-priority.high {
            background: var(--danger);
        }

        .badge-priority.medium {
            background: var(--warning);
        }

        .badge-priority.low {
            background: var(--success);
        }

        .todo-actions {
            display: flex;
            gap: 5px;
            flex-shrink: 0;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #718096;
        }

        .empty-state-icon {
            font-size: 3em;
            margin-bottom: 10px;
        }

        .filter-section {
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #e2e8f0;
        }

        .filter-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 8px 16px;
            border: 2px solid #e2e8f0;
            background: white;
            color: var(--dark);
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 500;
        }

        .filter-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .filter-btn:hover {
            border-color: var(--primary);
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: var(--primary);
        }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(102, 126, 234, 0.3);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .alert {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            animation: slideIn 0.3s ease;
        }

        .alert-success {
            background: rgba(72, 187, 120, 0.1);
            color: var(--success);
            border-left: 4px solid var(--success);
        }

        .alert-error {
            background: rgba(245, 101, 101, 0.1);
            color: var(--danger);
            border-left: 4px solid var(--danger);
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .todo-date {
            color: #a0aec0;
            font-size: 0.85em;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>✅ Todo App</h1>
            <p>Manage your tasks efficiently with local storage</p>
        </header>

        <div id="alertContainer"></div>

        <div class="content">
            <!-- Add Todo Form -->
            <div class="panel">
                <h2>📝 Add New Task</h2>
                <form id="todoForm">
                    <div class="form-group">
                        <label for="title">Task Title *</label>
                        <input type="text" id="title" placeholder="Enter task title" required>
                    </div>

                    <div class="form-group">
                        <label for="description">Description</label>
                        <textarea id="description" placeholder="Add task description (optional)"></textarea>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="category">Category</label>
                            <select id="category">
                                <option value="Personal">Personal</option>
                                <option value="Work">Work</option>
                                <option value="Shopping">Shopping</option>
                                <option value="Health">Health</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="priority">Priority</label>
                            <select id="priority">
                                <option value="low">Low</option>
                                <option value="medium" selected>Medium</option>
                                <option value="high">High</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="dueDate">Due Date</label>
                        <input type="date" id="dueDate">
                    </div>

                    <button type="submit" class="btn-primary">Add Task</button>
                </form>

                <div class="stats" id="stats">
                    <div class="stat-card">
                        <div class="stat-value" id="totalCount">0</div>
                        <div class="stat-label">Total Tasks</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="completedCount">0</div>
                        <div class="stat-label">Completed</div>
                    </div>
                </div>
            </div>

            <!-- Todo List -->
            <div class="panel">
                <h2>📋 Tasks</h2>

                <div class="filter-section">
                    <div class="filter-buttons">
                        <button class="filter-btn active" data-filter="all">All</button>
                        <button class="filter-btn" data-filter="pending">Pending</button>
                        <button class="filter-btn" data-filter="completed">Completed</button>
                    </div>
                </div>

                <div id="todoContainer" class="todo-list">
                    <div class="empty-state">
                        <div class="empty-state-icon">📭</div>
                        <p>No tasks yet. Add one to get started!</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:3002/api';
        let todos = [];
        let currentFilter = 'all';

        // Form submission
        document.getElementById('todoForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const title = document.getElementById('title').value.trim();
            const description = document.getElementById('description').value.trim();
            const category = document.getElementById('category').value;
            const priority = document.getElementById('priority').value;
            const dueDate = document.getElementById('dueDate').value;

            if (!title) {
                showAlert('Please enter a task title', 'error');
                return;
            }

            try {
                const response = await fetch(`${API_URL}/todos`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        title,
                        description,
                        category,
                        priority,
                        dueDate: dueDate || null
                    })
                });

                const data = await response.json();

                if (data.success) {
                    todos.push(data.data);
                    saveTodosToLocal();
                    renderTodos();
                    document.getElementById('todoForm').reset();
                    showAlert('Task added successfully!', 'success');
                } else {
                    showAlert(data.error || 'Failed to add task', 'error');
                }
            } catch (error) {
                showAlert(`Error: ${error.message}`, 'error');
            }
        });

        // Filter buttons
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                currentFilter = this.dataset.filter;
                renderTodos();
            });
        });

        // Load todos
        async function loadTodos() {
            try {
                // First try to load from local storage
                const localTodos = localStorage.getItem('todos');
                if (localTodos) {
                    todos = JSON.parse(localTodos);
                    renderTodos();
                    return;
                }

                // If no local todos, try to fetch from server
                const response = await fetch(`${API_URL}/todos`);
                const data = await response.json();

                if (data.success) {
                    todos = data.data;
                    saveTodosToLocal();
                    renderTodos();
                }
            } catch (error) {
                console.error('Error loading todos:', error);
                // Fall back to empty array
                todos = [];
                renderTodos();
            }
        }

        // Save todos to local storage
        function saveTodosToLocal() {
            localStorage.setItem('todos', JSON.stringify(todos));
        }

        // Render todos
        function renderTodos() {
            const container = document.getElementById('todoContainer');
            
            let filteredTodos = todos;
            if (currentFilter === 'pending') {
                filteredTodos = todos.filter(t => !t.completed);
            } else if (currentFilter === 'completed') {
                filteredTodos = todos.filter(t => t.completed);
            }

            if (filteredTodos.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">📭</div>
                        <p>No tasks in this category</p>
                    </div>
                `;
                updateStats();
                return;
            }

            container.innerHTML = filteredTodos.map(todo => `
                <div class="todo-item ${todo.completed ? 'completed' : ''} ${todo.priority}-priority">
                    <input 
                        type="checkbox" 
                        class="todo-checkbox" 
                        ${todo.completed ? 'checked' : ''}
                        onchange="toggleTodo('${todo.id}')"
                    >
                    <div class="todo-content">
                        <div class="todo-title">${escapeHtml(todo.title)}</div>
                        ${todo.description ? `<div class="todo-description">${escapeHtml(todo.description)}</div>` : ''}
                        <div class="todo-meta">
                            <span class="badge badge-category">${todo.category}</span>
                            <span class="badge badge-priority ${todo.priority}">${todo.priority.toUpperCase()}</span>
                            ${todo.dueDate ? `<span class="todo-date">📅 ${new Date(todo.dueDate).toLocaleDateString()}</span>` : ''}
                        </div>
                    </div>
                    <div class="todo-actions">
                        <button class="btn-small btn-warning" onclick="editTodo('${todo.id}')">Edit</button>
                        <button class="btn-small btn-danger" onclick="deleteTodo('${todo.id}')">Delete</button>
                    </div>
                </div>
            `).join('');

            updateStats();
        }

        // Toggle todo completion
        async function toggleTodo(id) {
            const todo = todos.find(t => t.id === id);
            if (!todo) return;

            todo.completed = !todo.completed;
            saveTodosToLocal();
            renderTodos();

            try {
                await fetch(`${API_URL}/todos/${id}/toggle`, { method: 'PATCH' });
            } catch (error) {
                console.error('Error toggling todo:', error);
            }
        }

        // Delete todo
        async function deleteTodo(id) {
            if (!confirm('Are you sure you want to delete this task?')) return;

            todos = todos.filter(t => t.id !== id);
            saveTodosToLocal();
            renderTodos();
            showAlert('Task deleted successfully', 'success');

            try {
                await fetch(`${API_URL}/todos/${id}`, { method: 'DELETE' });
            } catch (error) {
                console.error('Error deleting todo:', error);
            }
        }

        // Edit todo (simplified - just delete and recreate)
        function editTodo(id) {
            const todo = todos.find(t => t.id === id);
            if (!todo) return;

            document.getElementById('title').value = todo.title;
            document.getElementById('description').value = todo.description;
            document.getElementById('category').value = todo.category;
            document.getElementById('priority').value = todo.priority;
            document.getElementById('dueDate').value = todo.dueDate || '';

            deleteTodo(id);
            document.getElementById('title').focus();
        }

        // Update statistics
        function updateStats() {
            const total = todos.length;
            const completed = todos.filter(t => t.completed).length;

            document.getElementById('totalCount').textContent = total;
            document.getElementById('completedCount').textContent = completed;
        }

        // Show alert
        function showAlert(message, type) {
            const container = document.getElementById('alertContainer');
            const alert = document.createElement('div');
            alert.className = `alert alert-${type}`;
            alert.textContent = message;
            container.appendChild(alert);

            setTimeout(() => alert.remove(), 3000);
        }

        // Escape HTML
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Initialize
        loadTodos();
    </script>
</body>
</html>
